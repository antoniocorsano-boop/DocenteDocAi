<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DocenteDoc AI</title>

  <!-- Comprehensive Document/DOM polyfill for SSR/Edge compatibility - MUST be before any scripts -->
  <script>
    if (typeof window !== 'undefined') {
      // Ensure document exists with createElement
      if (typeof document === 'undefined') {
        window.document = {
          createElement: function(tag) { return {}; },
          createElementNS: function(ns, tag) { return {}; },
          createTextNode: function(text) { return {}; },
          getElementById: function(id) { return null; },
          querySelector: function(selector) { return null; },
          querySelectorAll: function(selector) { return []; },
          addEventListener: function() {},
          body: { appendChild: function() {}, insertBefore: function() {} },
          head: { appendChild: function() {} }
        };
      }
      
      // Ensure DOMParser exists
      if (typeof DOMParser === 'undefined') {
        window.DOMParser = class {
          parseFromString(str, type) {
            return { body: { childNodes: [] }, documentElement: {} };
          }
        };
      }
      
      // Ensure Node and HTMLElement exist
      if (typeof Node === 'undefined') {
        window.Node = class {};
      }
      if (typeof HTMLElement === 'undefined') {
        window.HTMLElement = class {};
      }
      
      // Ensure window.navigator exists
      if (typeof window.navigator === 'undefined') {
        window.navigator = { userAgent: '' };
      }
    }
  </script>

  <!-- PWA & Mobile App Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6750A4" />
  <link rel="icon" type="image/png" href="./icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DocenteDoc AI">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Identity Services for Drive Sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Google API Client for Picker -->
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- Material Symbols Font -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

</body>
