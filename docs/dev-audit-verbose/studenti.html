/* --- APP SHELL --- */
.app-shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    background: var(--aura-gradient);
    background-attachment: fixed;
}

/* --- HEADER (TOP APP BAR) --- */
.app-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-height);
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--sys-outline-variant);
    z-index: var(--z-header);
    display: flex;
    align-items: center;
    padding: 0 var(--content-padding);
}

@media (min-width: 840px) {
    .app-header {
        padding: 0 var(--content-padding-md);
    }
}

.header-content {
    width: 100%;
    max-width: var(--content-max-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
}

.header-leading,
.header-trailing {
    display: flex;
    align-items: center;
    gap: var(--spacing-2);
}

.header-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: var(--spacing-2);
}

/* --- MAIN CONTENT AREA --- */
.main-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;

  width: 56px;
  height: 56px;
  border: 6px solid var(--sys-primary-container);
  border-top: 6px solid var(--sys-primary);
  border-radius: 50%;
  animation: m3-spin 1s linear infinite;
  margin-bottom: 1.5rem;
}
@keyframes m3-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.m3-ripple {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: radial-gradient(circle, var(--sys-primary) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.18s var(--motion-easing-standard);
  z-index: 0;
}
.group:active .m3-ripple,
.group:focus-visible .m3-ripple {
  opacity: 0.10;
}
/* --- ACTION TILES (Bento Style Hardened) --- */
.op-tile {
  background-color: var(--sys-surface-container);
  border-radius: var(--shape-xl);
  padding: var(--spacing-6);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--spacing-6);
  border: 1px solid var(--sys-outline-variant);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  position: relative;
  overflow: initial;
  text-align: left;
  box-shadow: var(--elevation-1);
}

.op-tile:hover {
  background-color: var(--sys-surface-container-high);
  transform: translateY(-6px) scale(1.02);
  box-shadow: var(--elevation-2);
  border-color: var(--sys-primary);
}

.op-tile:active {
  transform: scale(0.97);
}

.op-tile-icon-container {
  width: 60px;
  height: 60px;
  border-radius: var(--shape-m);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  background-color: var(--sys-primary-container);
  color: var(--sys-on-primary-container);
  flex-shrink: 0;
  transition: transform 0.4s ease;
}

.op-tile:hover .op-tile-icon-container {
  transform: rotate(-5deg) scale(1.1);
}

.op-tile-variant-secondary .op-tile-icon-container {
  background-color: var(--sys-secondary-container);
  color: var(--sys-on-secondary-container);
}

.op-tile-variant-tertiary .op-tile-icon-container {
  background-color: var(--sys-tertiary-container);
  color: var(--sys-on-tertiary-container);
}

.op-tile-content {
  flex-grow: 1;
  min-width: 0;
}

.op-tile-title {
  color: var(--sys-on-surface);
  line-height: 1.1;
  font-weight: 900;
  font-size: 1.2rem;
}

.op-tile-subtitle {
  color: var(--sys-on-surface-variant);
  margin-top: 6px;
  opacity: 0.8;
  font-weight: 500;
}

/* --- HERO CARD (The Expressive Command Center) --- */
.hero-card {
  background: linear-gradient(145deg, var(--sys-primary-container) 0%, var(--sys-surface-container-high) 100%);
  border-radius: 56px;
  padding: calc(var(--spacing-8) * 1.5);
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow:
    0 20px 40px rgba(103, 80, 164, 0.08),
    inset 0 0 80px rgba(255, 255, 255, 0.3);
  position: relative;
  overflow: initial;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1;
}

.hero-card:hover {
  transform: translateY(-12px) scale(1.01);
  box-shadow:
    0 40px 80px rgba(103, 80, 164, 0.12),
    inset 0 0 100px rgba(255, 255, 255, 0.4);
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -20%;
  right: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, var(--sys-primary), transparent 70%);
  opacity: 0.15;
  filter: blur(60px);
  pointer-events: none;
  animation: aura-pulse 12s infinite linear;
}

.hero-card::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 40%;
  height: 40%;
  background: radial-gradient(circle, var(--sys-tertiary), transparent 70%);
  opacity: 0.1;
  filter: blur(50px);
  pointer-events: none;
  animation: aura-pulse 15s infinite reverse linear;
}

/* --- NAVIGATION GLASS BAR --- */
.bottom-nav-bar {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: var(--shape-full);
  height: 76px;
  display: flex;
  align-items: center;
  padding: 0 var(--spacing-6);
  gap: var(--spacing-3);
  box-shadow: var(--elevation-3);
  z-index: var(--z-nav);
}

/* --- M3 POPUP MENU (Expressive Glass) --- */
.m3-popup-menu {
  position: fixed;
  top: calc(var(--header-height) + var(--spacing-2));
  right: var(--content-padding);
  min-width: 240px;
  max-width: min(320px, calc(100vw - 32px));
  background-color: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: var(--shape-xl);
  box-shadow: var(--elevation-3);
  z-index: var(--z-popover);
  overflow: hidden;
  animation: aura-slide-up 0.4s var(--motion-expressive);
  padding: var(--spacing-2);
}

.m3-menu-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  padding: var(--spacing-3) var(--spacing-4);
  border-radius: 20px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--sys-on-surface);
  font-family: var(--font-family);
  font-size: var(--typography-body-medium-fontSize);
  font-weight: 700;
  transition: all 0.2s ease;
  text-align: left;
}

.m3-menu-item:hover {
  background-color: rgba(103, 80, 164, 0.08);
  transform: translateX(4px);
}

.m3-menu-item:active {
  transform: scale(0.98);
}

.m3-menu-item .material-symbols-outlined {
  font-size: 22px;
  opacity: 0.7;
}

.m3-menu-item:hover .material-symbols-outlined {
  opacity: 1;
  color: var(--sys-primary);
}

.m3-menu-divider {
  height: 1px;
  background-color: var(--sys-outline-variant);
  opacity: 0.3;
  margin: var(--spacing-2) var(--spacing-4);
}

.m3-menu-section-label {
  padding: var(--spacing-3) var(--spacing-4) var(--spacing-1);
  font-size: var(--typography-label-small-fontSize);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--sys-primary);
  opacity: 0.6;
}

/* --- M3 EXPRESSIVE BUTTONS --- */
.button {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--spacing-6);
  height: 48px;
  border-radius: 9999px;
  /* Capsule */
  font-family: var(--font-family);
  font-weight: 700;
  font-size: var(--typography-body-medium-fontSize);
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all var(--motion-duration-short3) var(--motion-easing-standard);
  border: none;
  overflow: hidden;
  text-transform: uppercase;
}

.button:hover {
  transition: all var(--motion-duration-short4) var(--motion-easing-standard);
}

.button:active {
  transform: scale(0.96);
  transition: transform var(--motion-duration-short1) var(--motion-easing-accelerate);
}

.button-filled {
  background-color: var(--sys-primary);
  color: var(--sys-on-primary);
  box-shadow: var(--elevation-2);
}

.button-filled:hover {
  background-color: color-mix(in srgb, var(--sys-primary), white 12%);
  box-shadow: var(--elevation-3);
  transform: translateY(-2px);
}

.button-tonal {
  background-color: var(--sys-secondary-container);
  color: var(--sys-on-secondary-container);
}

.button-tonal:hover {
  background-color: color-mix(in srgb, var(--sys-secondary-container), black 8%);
  box-shadow: var(--elevation-1);
}

.button-outlined {
  background-color: transparent;
  border: 1px solid var(--sys-outline);
  color: var(--sys-primary);
}

.button-outlined:hover {
  background-color: rgba(103, 80, 164, 0.08);
  /* primary/8 */
  border-color: var(--sys-primary);
}

.button-text {
  background-color: transparent;
  color: var(--sys-primary);
  padding: 0 var(--spacing-4);
}

.button-text:hover {
  background-color: rgba(103, 80, 164, 0.08);
}

/* --- M3 DIALOG & MODAL SYSTEM --- */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal-backdrop);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-4);
  background-color: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: dialog-backdrop-enter var(--motion-duration-short3) var(--motion-easing-standard) forwards;
}

@keyframes dialog-backdrop-enter {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.dialog-container {
  background-color: var(--sys-surface-container-high);
  border-radius: 28px;
  box-shadow: var(--elevation-3);
  border: 1px solid var(--sys-outline-variant);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: dialog-container-enter var(--motion-duration-short4) var(--motion-easing-standard) forwards;
}

@keyframes dialog-container-enter {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.dialog-header {
  padding: var(--spacing-6);
  border-bottom: 1px solid var(--sys-outline-variant);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--spacing-4);
  flex-shrink: 0;
  background-color: var(--sys-surface-container-high);
  transition: background-color var(--motion-duration-short2) var(--motion-easing-standard);
}

.dialog-content {
  padding: var(--spacing-6);
  overflow-y: auto;
  flex-grow: 1;
  background-color: var(--sys-surface);
}

.dialog-footer {
  padding: var(--spacing-6);
  border-top: 1px solid var(--sys-outline-variant);
  background-color: var(--sys-surface-container-high);
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-3);
  flex-shrink: 0;
  transition: background-color var(--motion-duration-short2) var(--motion-easing-standard);
}

/* --- ICON BUTTON (for close, etc) --- */
.icon-button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background-color: transparent;
  color: var(--sys-on-surface-variant);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--motion-duration-short2) var(--motion-easing-standard);
  font-size: 20px;
}

.icon-button:hover {
  background-color: var(--sys-primary-container);
  color: var(--sys-on-primary-container);
  transition: all var(--motion-duration-short3) var(--motion-easing-standard);
}

.icon-button:active {
  transform: scale(0.92);
  transition: transform var(--motion-duration-short1) var(--motion-easing-accelerate);
}

/* --- AUTHENTICATION SCREEN --- */
.auth-screen {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  background: var(--aura-gradient);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--spacing-4);
  padding-top: max(var(--spacing-4), env(safe-area-inset-top));
  padding-bottom: max(var(--spacing-4), env(safe-area-inset-bottom));
}

/* --- LOGIN CARD UX/UI PRO PATCH --- */
.m3-auth-card, .auth-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 370px;
  min-height: 0;
  background: var(--glass-bg);
  border-radius: 20px;
  box-shadow: var(--elevation-2);
  padding: 4px 4px 3px 4px;
  gap: 4px;
  border: var(--glass-border);
  font-family: var(--font-family);
}

.auth-header, .auth-institutional-login, .auth-manual-login, .auth-footer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
} 

.auth-logo {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 80px;
  height: 32px;
  margin: 0 auto 4px auto;
} 
.auth-title {
  font-family: var(--font-family);
  font-size: 1.02rem;
  font-weight: 900;
  letter-spacing: -0.01em;
  color: var(--sys-on-surface);
  margin-bottom: 0;
  line-height: 1.0;
} 

.auth-title span {
  color: var(--sys-primary);
}

.auth-subtitle {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--sys-on-surface-variant);
  opacity: 0.7;
  margin-bottom: 0;
  line-height: 1.0;
} 

.auth-institutional-login {
  background: var(--sys-surface-container-lowest);
  border-radius: 16px;
  padding: 12px 0 8px 0;
  box-shadow: none;
  gap: 8px;
}

.auth-divider {
  width: 100%;
  text-align: center;
  margin: 10px 0 8px 0;
  color: var(--sys-on-surface-variant);
  font-size: 0.95rem;
  font-weight: 700;
  opacity: 0.6;
  letter-spacing: 0.12em;
}

.auth-manual-login {
  gap: 10px;
  width: 100%;
}

.auth-footer {
  margin-top: 8px;
  gap: 4px;
  font-size: 0.85rem;
  opacity: 0.7;
}

.auth-privacy-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--sys-surface-container-highest);
  border-radius: 9999px;
  border: 1px solid var(--sys-outline-variant);
  padding: 2px 10px;
  font-size: 0.85em;
}

.button, .button-filled, .auth-submit-btn {
  width: 100%;
  min-height: 44px;
  border-radius: 22px;
  font-size: 1rem;
  font-weight: 700;
  background: var(--sys-primary);
  color: var(--sys-on-primary);
  border: none;
  box-shadow: var(--elevation-1);
  transition: background 0.2s, box-shadow 0.2s;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.button-filled:hover, .auth-submit-btn:hover {
  background: var(--sys-primary-container);
  color: var(--sys-on-primary-container);
}

.m3-field-container, .m3-field-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.m3-field-label {
  font-size: 0.79rem;
  font-weight: 700;
  color: var(--sys-primary);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 0;
  line-height: 1.01;
} 
.m3-field-input {
  width: 100%;
  min-height: 20px;
  border-radius: 12px;
  border: 1px solid var(--sys-outline-variant);
  background: var(--sys-surface-container);
  font-size: 0.85rem;
  padding: 2px 3px;
  color: var(--sys-on-surface);
  font-family: var(--font-family);
  font-weight: 500;
  transition: border 0.2s;
  line-height: 1.0;
} 
.m3-field-input:focus {
  border: 1.5px solid var(--sys-primary);
  outline: none;
}

/* --- MISSING STYLES FOR HEADER & MODALS
   ========================================================================== */

/* Header Actions Popover positioning */
.header-actions-popover {
  position: fixed;
  top: calc(var(--header-height, 64px) + 8px);
  right: var(--spacing-4);
  z-index: var(--z-popover, 1000);
  max-height: calc(100vh - var(--header-height, 64px) - 32px);
  overflow-y: auto;
}

/* Page Layout */
.page-layout {
  width: 100%;
  max-width: 100%;
}

/* Page Header Block */
.page-header-block {
  margin-bottom: var(--spacing-6);
  padding-bottom: var(--spacing-4);
  border-bottom: 1px solid var(--sys-outline-variant);
}

/* FAQ Item */
.faq-item {
  background-color: var(--sys-surface-container);
  border-radius: var(--shape-m);
  padding: var(--spacing-4);
  border: 1px solid var(--sys-outline-variant);
  transition: all var(--motion-duration-short) var(--motion-easing-standard);
}

.faq-item[open] {
  background-color: var(--sys-surface-container-high);
  border-color: var(--sys-primary);
}

.faq-item summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
}

.faq-item summary::-webkit-details-marker {
  display: none;
}

.faq-item summary::before {
  content: 'expand_more';
  font-family: 'Material Symbols Outlined';
  font-size: 20px;
  transition: transform var(--motion-duration-short) var(--motion-easing-standard);
}

.faq-item[open] summary::before {
  transform: rotate(180deg);
}

/* Vertical Segmented Button Group */
/* ...existing code... */

.vertical-segmented-group.responsive {
  flex-direction: row;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ...existing code... */

.segmented-button:hover {
  background-color: var(--sys-surface-container);
}

.segmented-button.active {
  background-color: var(--sys-secondary-container);
  color: var(--sys-on-secondary-container);
  font-weight: 700;
}

/* ==========================================================================
   ADDITIONAL UTILITY STYLES
   ========================================================================== */

/* Text Eyebrow - Small label above titles */
.text-eyebrow {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--sys-on-surface-variant);
  margin-bottom: var(--spacing-2);
}

/* Filled Icon Style for Material Symbols */
.filled-icon {
  font-variation-settings: 'FILL' 1;
}

/* Line Clamp Utilities */
.line-clamp-1 {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 1;
  line-clamp: 1;
}

.line-clamp-2 {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

.line-clamp-3 {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
}

/* Prose - Typography for rich content */
.prose {
  max-width: 65ch;
  color: var(--sys-on-surface);
}

.prose h1, .prose h2, .prose h3, .prose h4 {
  color: var(--sys-on-surface);
  font-weight: 700;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  line-height: 1.3;
}

.prose h1 { font-size: 1.875rem; }
.prose h2 { font-size: 1.5rem; }
.prose h3 { font-size: 1.25rem; }
.prose h4 { font-size: 1.125rem; }

.prose p {
  margin-bottom: 1em;
  line-height: 1.7;
}

.prose ul, .prose ol {
  padding-left: 1.5em;
  margin-bottom: 1em;
}

.prose li {
  margin-bottom: 0.5em;
}

.prose a {
  color: var(--sys-primary);
  text-decoration: underline;
}

.prose strong {
  font-weight: 700;
  color: var(--sys-on-surface);
}

.prose code {
  background-color: var(--sys-surface-container-high);
  padding: 0.125em 0.375em;
  border-radius: var(--shape-xs);
  font-size: 0.875em;
  font-family: monospace;
}

.prose blockquote {
  border-left: 4px solid var(--sys-primary);
  padding-left: 1em;
  margin: 1em 0;
  font-style: italic;
  color: var(--sys-on-surface-variant);
}

.prose-headings\:font-serif h1,
.prose-headings\:font-serif h2,
.prose-headings\:font-serif h3 {
  font-family: Georgia, serif;
}

.prose-headings\:text-primary h1,
.prose-headings\:text-primary h2,
.prose-headings\:text-primary h3 {
  color: var(--sys-primary);
}

.prose-p\:text-on-surface p {
  color: var(--sys-on-surface);
}

.prose-li\:text-on-surface li {
  color: var(--sys-on-surface);
}

/* Max Width None for prose */
.max-w-none {
  max-width: none;
}

/* Truncate text */
.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ==========================================================================
   M3 AUTH SCREEN - LOGIN & ONBOARDING
   ========================================================================== */
.m3-auth-screen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-4);
  background: linear-gradient(135deg, var(--sys-surface) 0%, var(--sys-surface-container-low) 50%, var(--sys-surface-container) 100%);
  position: relative;
  overflow: auto;
}

/* Decorative background effect */
.m3-auth-screen::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 20%, rgba(var(--sys-primary-rgb, 103, 80, 164), 0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(var(--sys-tertiary-rgb, 125, 82, 96), 0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* eliminato: legacy, verrà reinserito blocco moderno */

/* Mobile responsiveness */
@media (max-width: 480px) {
  .m3-auth-screen {
    padding: var(--spacing-3);
    justify-content: flex-start;
    padding-top: env(safe-area-inset-top, var(--spacing-6));

}

.m3-auth-card, .auth-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;

    max-width: 100vw;
    box-sizing: border-box;
    box-shadow: var(--elevation-1);
}

.timetable-matrix.single-day-view {
    grid-template-columns: 50px minmax(0, 1fr);
}

.matrix-header-cell {
    background-color: var(--sys-surface);
    padding: 8px 2px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--sys-on-surface);
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.matrix-header-cell.today {
    color: var(--sys-primary);
    background-color: var(--sys-primary-container);
}

.matrix-header-time {
    background-color: var(--sys-surface-container-highest);
    color: var(--sys-on-surface-variant);
    font-size: var(--typography-label-small-fontSize);
    padding: 8px 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    font-weight: bold;
}

.matrix-time-label {
    background-color: var(--sys-surface-container-highest);
    color: var(--sys-on-surface-variant);
    font-size: var(--typography-label-small-fontSize);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    width: 50px;
}

.matrix-cell-wrapper {
    background-color: var(--sys-surface);
    height: 70px;
    max-height: 70px;
    min-height: 70px;
    position: relative;
    overflow: hidden;
}

.timetable-tile {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter var(--motion-duration-short) var(--motion-easing-standard),
        box-shadow var(--motion-duration-short) var(--motion-easing-standard);
    position: relative;
    padding: 4px;
    background-color: hsl(var(--slot-hue), 85%, 96%);
    color: hsl(var(--slot-hue), 40%, 20%);
    overflow: hidden;
    box-shadow: var(--elevation-0);
}

.theme-dark .timetable-tile {
    background-color: hsl(var(--slot-hue), 60%, 20%);
    color: hsl(var(--slot-hue), 90%, 90%);
    border: 1px solid hsl(var(--slot-hue), 50%, 30%);
}

.timetable-tile:hover {
    filter: brightness(0.95);
    box-shadow: var(--elevation-1);
}

.timetable-tile:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: -2px;
    z-index: 10;
    box-shadow: 0 0 0 4px var(--sys-primary-container);
}

.timetable-tile.empty {
    background-color: var(--sys-surface);
    opacity: 0.5;
}

.tile-class {
    font-weight: 800;
    font-size: 14px;
    line-height: 1.2;
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    display: block;
    text-align: center;
}

.tile-subject {
    font-size: var(--typography-label-small-fontSize);
    text-transform: uppercase;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    text-align: center;
    display: block;
}

.tile-indicators-container {
    position: absolute;
    top: 2px;
    left: 2px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.tile-indicator {
    width: 5px;
    height: 5px;
    border-radius: var(--shape-full);
}

.tile-icon-type {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 12px;
    opacity: 0.7;
}

.indicator-success {
    background-color: var(--sys-primary);
}

.indicator-warning {
    background-color: var(--sys-warning);
}

.indicator-info {
    background-color: var(--sys-tertiary);
}

/* --- 11. EVALUATION & STUDENT LISTS --- */
.evaluation-grid-container {
    overflow-x: auto;
}

.evaluation-grid-table th,
.evaluation-grid-table td {
    padding: 8px;
    vertical-align: middle;
}

.sticky-col-student {
    position: sticky;
    left: 0;
    background-color: var(--sys-surface);
    z-index: 10;
    border-right: 1px solid var(--sys-outline-variant);
    min-width: 120px;
    max-width: 180px;
}

.grade-badge {
    display: inline-block;
    min-width: 32px;
    text-align: center;
    padding: 4px 8px;
    border-radius: var(--shape-s);
    font-weight: 700;
    background-color: var(--sys-surface-container-high);
    color: var(--sys-on-surface);
}

.grade-badge.positive {
    background-color: var(--sys-primary-container);
    color: var(--sys-on-primary-container);
}

.grade-badge.negative {
    background-color: var(--sys-error-container);
    color: var(--sys-on-error-container);
}

.risk-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

.risk-card-content {
    padding-top: 12px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    margin-top: 12px;
}

.expressive-student-card,
.expressive-student-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background-color: var(--sys-surface-container-low);
    border-radius: var(--shape-l);
    transition: background-color var(--motion-duration-short) var(--motion-easing-standard);
    border: 1px solid var(--sys-outline-variant);
    margin-bottom: 8px;
    cursor: pointer;
    box-shadow: var(--elevation-0);
}

.expressive-student-card:hover,
.expressive-student-item:hover {
    background-color: var(--sys-surface-container-high);
    box-shadow: var(--elevation-1);
}

.expressive-student-card:focus-visible,
.expressive-student-item:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.student-list-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
}

/* --- 12. KNOWLEDGE BASE GRID --- */
.kb-dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
}

.kb-file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    padding: 16px;
    overflow-y: auto;
}

.kb-file-card {
    background-color: var(--sys-surface-container-low);
    border-radius: var(--shape-m);
    padding: 12px;
    border: 1px solid var(--sys-outline-variant);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background-color var(--motion-duration-short) var(--motion-easing-standard),
        box-shadow var(--motion-duration-short) var(--motion-easing-standard),
        border-color var(--motion-duration-short) var(--motion-easing-standard);
    position: relative;
    box-shadow: var(--elevation-0);
}

.kb-file-card:hover {
    background-color: var(--sys-surface-container-high);
    box-shadow: var(--elevation-1);
    border-color: var(--sys-primary);
}

.kb-file-card:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.kb-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--sys-outline-variant);
    background-color: var(--sys-surface);
}

.kb-search-container {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
}

.category-selection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

/* --- 13. NOTEBOOK & CHAT --- */
.notebook-layout {
    display: flex;
    height: calc(100dvh - 64px);
    background-color: var(--sys-background);
    overflow: hidden;
    position: relative;
}

.notebook-sidebar {
    width: 280px;
    background-color: var(--sys-surface-container-low);
    border-right: 1px solid var(--sys-outline-variant);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.notebook-sidebar-header {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.notebook-project-list {
    flex-grow: 1;
    overflow-y: auto;
    padding: 8px;
}

.notebook-project-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: var(--shape-full);
    cursor: pointer;
    color: var(--sys-on-surface-variant);
    transition: all var(--motion-duration-short) var(--motion-easing-standard);
    box-shadow: var(--elevation-0);
}

.notebook-project-item:hover {
    background-color: var(--sys-surface-container-high);
    box-shadow: var(--elevation-1);
}

.notebook-project-item:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.notebook-project-item.active {
    background-color: var(--sys-secondary-container);
    color: var(--sys-on-secondary-container);
    font-weight: 600;
    box-shadow: var(--elevation-1);
}

.notebook-main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: var(--sys-surface);
    position: relative;
}

.notebook-workspace-layout {
    display: flex;
    height: 100%;
}

.notebook-sources-panel {
    width: 240px;
    border-right: 1px solid var(--sys-outline-variant);
    display: flex;
    flex-direction: column;
    background-color: var(--sys-surface);
    padding: 16px;
    gap: 12px;
}

.notebook-sources-list {
    flex-grow: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.notebook-source-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background-color: var(--sys-surface-container-lowest);
    border: 1px solid var(--sys-outline-variant);
    border-radius: var(--shape-s);
    font-size: 13px;
    box-shadow: var(--elevation-0);
}

.notebook-workspace {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.notebook-tabs {
    display: flex;
    border-bottom: 1px solid var(--sys-outline-variant);
    padding: 0 16px;
    background-color: var(--sys-surface);
    flex-shrink: 0;
}

.notebook-tab {
    padding: 12px 24px;
    border-bottom: 2px solid transparent;
    color: var(--sys-on-surface-variant);
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    transition: all var(--motion-duration-short) var(--motion-easing-standard);
    box-shadow: var(--elevation-0);
}

.notebook-tab:hover {
    background-color: var(--sys-surface-container-high);
}

.notebook-tab:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.notebook-tab.active {
    color: var(--sys-primary);
    border-bottom-color: var(--sys-primary);
}

.notebook-tab-content {
    flex-grow: 1;
    overflow-y: auto;
    background-color: var(--sys-surface-container-lowest);
    position: relative;
}

.notebook-mobile-header {
    display: none;
    padding: 12px 16px;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--sys-outline-variant);
    background-color: var(--sys-surface);
}

@media (max-width: 768px) {
    .notebook-sidebar {
        width: 100%;
        position: absolute;
        z-index: 10;
        height: 100%;
        transition: transform 0.3s ease;
    }

    .notebook-main {
        width: 100%;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        position: absolute;
        height: 100%;
        z-index: 20;
    }

    .notebook-layout.mobile-workspace-visible .notebook-sidebar {
        transform: translateX(-20%);
        opacity: 0;
        pointer-events: none;
    }

    .notebook-layout.mobile-workspace-visible .notebook-main {
        transform: translateX(0);
    }

    .notebook-mobile-header {
        display: flex;
    }

    .notebook-workspace-layout {
        flex-direction: column;
    }

    .notebook-sources-panel {
        width: 100%;
        height: auto;
        max-height: 150px;
        border-right: none;
        border-bottom: 1px solid var(--sys-outline-variant);
        padding: 8px;
        flex-shrink: 0;
    }

    .notebook-sources-list {
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        padding-bottom: 4px;
    }

    .notebook-source-item {
        min-width: 140px;
    }
}

.chat-message-bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: var(--shape-l);
    margin-bottom: 12px;
    line-height: 1.5;
    position: relative;
    word-wrap: break-word;
}

.chat-message-bubble.user {
    margin-left: auto;
    background-color: var(--sys-primary);
    color: var(--sys-on-primary);
    border-bottom-right-radius: var(--shape-s);
}

.chat-message-bubble.model,
.chat-message-bubble.ai {
    margin-right: auto;
    background-color: var(--sys-surface-container-high);
    color: var(--sys-on-surface);
    border-bottom-left-radius: var(--shape-s);
    border: 1px solid var(--sys-outline-variant);
}

.corpus-chat-container {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.corpus-chat-messages {
    flex-grow: 1;
    overflow-y: auto;
    padding: 16px;
    background-color: var(--sys-surface-container-lowest);
    display: flex;
    flex-direction: column;
}

.corpus-chat-input-form {
    padding: 16px;
    border-top: 1px solid var(--sys-outline-variant);
    background-color: var(--sys-surface);
    display: flex;
    gap: 8px;
}

.chat-message-content {
    overflow-wrap: break-word;
}

/* --- 14. STUDIO & REPORT HUB --- */
.studio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
}

.card-top-accent-primary {
    border-top: 4px solid var(--sys-primary);
}

.card-top-accent-secondary {
    border-top: 4px solid var(--sys-secondary);
}

.card-top-accent-tertiary {
    border-top: 4px solid var(--sys-tertiary);
}

.studio-action-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

.studio-action-card {
    background-color: var(--sys-surface-container-low);
    border: 1px solid var(--sys-outline-variant);
    border-radius: var(--shape-m);
    padding: 12px;
    text-align: left;
    cursor: pointer;
    transition: all var(--motion-duration-short) var(--motion-easing-standard);
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
    box-shadow: var(--elevation-0);
}

.studio-action-card:hover {
    background-color: var(--sys-surface-container-high);
    box-shadow: var(--elevation-1);
    transform: translateY(-2px);
}

.studio-action-card:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.studio-action-card-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--shape-s);
    background-color: var(--sys-primary-container);
    color: var(--sys-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
}

.hub-links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
}

.hub-link-item {
    background-color: var(--sys-surface-container-low);
    border: 1px solid var(--sys-outline-variant);
    border-radius: var(--shape-l);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all var(--motion-duration-short) var(--motion-easing-standard);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: var(--elevation-0);
}

.hub-link-item:hover {
    background-color: var(--sys-surface-container-high);
    transform: translateY(-2px);
    box-shadow: var(--elevation-1);
}

.hub-link-item:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}

.hub-link-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--shape-full);
    background-color: var(--sys-primary-container);
    color: var(--sys-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

/* --- 15. CONSIGLIO DI CLASSE TABLE --- */
.consiglio-table th,
.consiglio-table td {
    white-space: nowrap;
    padding: 8px 12px;
    font-size: var(--typography-body-medium-fontSize);
}

.sticky-header th {
    position: sticky;
    top: 0;
    background-color: var(--sys-surface-container);
    z-index: 10;
}

.cell-changed input,
.cell-changed select,
.cell-changed textarea {
    background-color: var(--sys-tertiary-container);
    transition: background-color 1s;
}

.consiglio-student-card-expandable {
    background-color: var(--sys-surface-container-low);
    border-radius: var(--shape-l);
    border: 1px solid var(--sys-outline-variant);
    overflow: hidden;
}

.consiglio-student-card-header {
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.consiglio-student-card-content {
    display: none;
    border-top: 1px solid var(--sys-outline-variant);
    background-color: var(--sys-surface);
}

.consiglio-student-card-content.expanded {
    display: block;
    animation: slideDown 0.2s ease-out;
}

.desktop-only {
    display: block;
}

.mobile-only {
    display: none;
}

@media(max-width: 768px) {
    .desktop-only {
        display: none;
    }

    .mobile-only {
        display: block;
    }
}

/* --- 16. OTHER WIDGETS --- */
.interactive-tool-widget {
    background-color: var(--sys-surface-container);
    border-radius: var(--shape-xl);
    padding: 24px;
    text-align: center;
    border: 1px solid var(--sys-outline-variant);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    box-shadow: var(--elevation-1);
}

.timer-display {
    font-family: 'Roboto Mono', monospace;
    font-size: 48px;
    font-weight: 700;
    color: var(--sys-on-surface);
    letter-spacing: 2px;
    margin: 16px 0;
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
}

.random-result-box {
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--sys-primary);
    margin-bottom: 16px;
    text-align: center;
    width: 100%;
}

.stat-card-expressive {
    background-color: var(--sys-surface-container);
    padding: 16px;
    border-radius: var(--shape-l);
    border: 1px solid var(--sys-outline-variant);
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.stat-value-large {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
}

.guidance-card {
    background-color: var(--sys-secondary-container);
    color: var(--sys-on-secondary-container);
    border-radius: var(--shape-l);
    padding: 16px;
    display: flex;
    gap: 16px;
    position: relative;
    align-items: flex-start;
    margin-bottom: 16px;
    box-shadow: var(--elevation-1);
}

.guidance-icon {
    font-size: 24px;
}

.guidance-content {
    flex-grow: 1;
}

.guide-card {
    background-color: var(--sys-surface-container-low);
    border: 1px solid var(--sys-outline-variant);
    border-radius: var(--shape-l);
    padding: 16px;
    box-shadow: var(--elevation-0);
}

.guide-card-badge {
    font-size: 10px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: var(--shape-m);
    background-color: var(--sys-primary);
    color: var(--sys-on-primary);
}

/* --- 17. GANTT TIMELINE 2.0 --- */
.gantt-container {
    background-color: var(--sys-surface-container-low);
    border-radius: var(--shape-xl);
    border: 1px solid var(--sys-outline-variant);
    overflow: hidden;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--elevation-1);
}

.gantt-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--sys-surface-container);
    border-bottom: 1px solid var(--sys-outline-variant);
}

.gantt-body {
    position: relative;
    overflow-x: auto;
    min-height: 250px;
    background-color: var(--sys-surface);
}

.gantt-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    /* 10 Months: Sep - Jun */
    min-width: 800px;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    min-height: 250px;
}

.gantt-month-col {
    border-right: 1px dashed var(--sys-outline-variant);
    position: relative;
    height: 100%;
}

.gantt-month-label {
    position: absolute;
    top: 8px;
    left: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--sys-on-surface-variant);
    text-transform: uppercase;
    opacity: 0.6;
    z-index: 1;
}

.gantt-tracks-layer {
    position: relative;
    z-index: 5;
    min-width: 800px;
    padding-top: 40px;
    padding-bottom: 20px;
}

.gantt-lane {
    height: 44px;
    position: relative;
    margin-bottom: 8px;
}

.gantt-lane:nth-child(even) {
    background-color: var(--sys-surface-container-high);
}

.gantt-bar {
    position: absolute;
    top: 4px;
    bottom: 4px;
    border-radius: var(--shape-s);
    background-color: var(--sys-primary-container);
    color: var(--sys-on-primary-container);
    border: 1px solid var(--sys-primary);
    font-size: 11px;
    font-weight: 600;
    padding: 0 8px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    box-shadow: var(--elevation-1);
    transition: all var(--motion-duration-short) var(--motion-easing-standard);
    z-index: 10;
}

.gantt-bar:hover {
    transform: scaleY(1.1);
    z-index: 15;
    box-shadow: var(--elevation-2);
}

.gantt-bar:focus-visible {
    outline: 2px solid var(--sys-primary);
    outline-offset: 2px;
}


.gantt-events-row {
    height: 30px;
    position: relative;
    margin-bottom: 10px;
}

.gantt-event-marker {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: help;
    z-index: 20;
}

.gantt-event-icon {
    font-size: 18px;
    color: var(--sys-error);
    background-color: var(--sys-surface);
    border-radius: var(--shape-full);
    box-shadow: var(--elevation-1);
}

.gantt-event-line {
    width: 1px;
    height: 100%;
    background-color: var(--sys-outline-variant);
    opacity: 0.5;
}

/* ==========================================================================
   SETTINGS COMPONENTS
   ========================================================================== */

/* Settings Card (Accordion) */
.settings-card {
    background: var(--sys-surface);
    border-radius: var(--shape-xl);
    border: 1px solid var(--sys-outline-variant);
    overflow: hidden;
    transition: all var(--motion-duration-short4) var(--motion-easing-standard);
}

.settings-card[open] {
    box-shadow: var(--elevation-1);
}

.settings-card.variant-primary {
    border-color: var(--sys-primary);
    background: linear-gradient(135deg, var(--sys-primary-container) 0%, var(--sys-surface) 100%);
}

.settings-card.variant-secondary {
    border-color: var(--sys-secondary);
}

.settings-card.variant-tertiary {
    border-color: var(--sys-tertiary);
}

/* Settings Summary (Header) */
.settings-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-4);
    cursor: pointer;
    list-style: none;
    user-select: none;
    transition: background-color var(--motion-duration-short3) var(--motion-easing-standard);
}

.settings-summary::-webkit-details-marker {
    display: none;
}

.settings-summary:hover {
    background: var(--sys-surface-container-low);
}

.settings-icon-box {
    width: 48px;
    height: 48px;
    border-radius: var(--shape-l);
    background: var(--sys-primary-container);
    color: var(--sys-on-primary-container);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.settings-card.variant-secondary .settings-icon-box {
    background: var(--sys-secondary-container);
    color: var(--sys-on-secondary-container);
}

.settings-card.variant-tertiary .settings-icon-box {
    background: var(--sys-tertiary-container);
    color: var(--sys-on-tertiary-container);
}

.settings-title {
    font-size: var(--typography-title-medium);
    font-weight: 700;
    color: var(--sys-on-surface);
    margin: 0;
}

.settings-subtitle {
    font-size: var(--typography-body-small);
    color: var(--sys-on-surface-variant);
    margin: var(--spacing-1) 0 0 0;
}

.settings-chevron {
    color: var(--sys-on-surface-variant);
    transition: transform var(--motion-duration-short4) var(--motion-easing-standard);
}

/* Settings Content */
.settings-content {
    padding: 0 var(--spacing-4) var(--spacing-4);
    border-top: 1px solid var(--sys-outline-variant);
}

/* ==========================================================================
   THEME BUBBLE (Color Picker)
   ========================================================================== */

.m3-theme-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-2);
    padding: var(--spacing-3);
    background: var(--sys-surface-container);
    border: 2px solid var(--sys-outline-variant);
    border-radius: var(--shape-xl);
    cursor: pointer;
    transition: all var(--motion-duration-short4) var(--motion-easing-standard);
    min-width: 100px;
}

.m3-theme-card:hover {
    border-color: var(--sys-outline);
    background: var(--sys-surface-container-high);
    transform: translateY(-2px);
    box-shadow: var(--elevation-1);
}

.m3-theme-card.selected {
    border-color: var(--sys-primary);
    background: var(--sys-primary-container);
    box-shadow: var(--elevation-2);
}

.m3-theme-preview {
    position: relative;
    width: 64px;
    height: 48px;
    border-radius: var(--shape-m);
    overflow: hidden;
}

.theme-preview-bg {
    position: absolute;
    inset: 0;
    opacity: 0.9;
}

.theme-preview-circle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: var(--shape-full);
    top: 8px;
    left: 8px;
    box-shadow: var(--elevation-1);
}

.theme-preview-bar {
    position: absolute;
    width: 32px;
    height: 8px;
    border-radius: var(--shape-xs);
    bottom: 8px;
    right: 8px;
}

.theme-check-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.3);
    color: white;
    opacity: 0;
    transition: opacity var(--motion-duration-short3) var(--motion-easing-standard);
}

.m3-theme-card.selected .theme-check-icon {
    opacity: 1;
}

.m3-theme-label {
    font-size: var(--typography-label-small);
    font-weight: 600;
    color: var(--sys-on-surface);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}

.m3-theme-card.selected .m3-theme-label {
    color: var(--sys-on-primary-container);
    font-weight: 700;
}

/* ==========================================================================
   FORM COMPONENTS ENHANCEMENTS
   ========================================================================== */

/* Card Inner Section */
.card-inner {
    padding: var(--spacing-4);
    background: var(--sys-surface-container);
    border-radius: var(--shape-l);
    border: 1px solid var(--sys-outline-variant);
}

/* Button variants for settings */
.button-outlined-error {
    background: transparent;
    color: var(--sys-error);
    border: 1px solid var(--sys-error);
}

.button-outlined-error:hover {
    background: var(--sys-error-container);
}

.button-drop {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-2);
    padding: var(--spacing-2) var(--spacing-4);
    border-radius: var(--shape-full);
    border: 1px solid var(--sys-outline-variant);
    background: var(--sys-surface);
    color: var(--sys-on-surface);
    font-size: var(--typography-label-medium);
    font-weight: 500;
    cursor: pointer;
    transition: all var(--motion-duration-short4) var(--motion-easing-standard);
}

.button-drop:hover {
    background: var(--sys-surface-container-high);
}

.button-drop.danger {
    color: var(--sys-error);
    border-color: var(--sys-error);
}

.button-drop.danger:hover {
    background: var(--sys-error-container);
