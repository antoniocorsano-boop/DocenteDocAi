name: MD3 Gold Compliance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  md3-gold-compliance:
    name: MD3 Gold Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint with MD3 Rules
        run: |
          npx eslint src/ --max-warnings 0 --format=json > eslint-results.json || true

          # Check for MD3 design-system violations
          MD3_VIOLATIONS=$(jq '[.[] | select(.messages | any(.ruleId | startswith("design-system/")))] | length' eslint-results.json 2>/dev/null || echo "0")

          if [ "$MD3_VIOLATIONS" -gt 0 ]; then
            echo "❌ MD3 GOLD COMPLIANCE FAILED: $MD3_VIOLATIONS violations found"
            echo ""
            echo "🚫 VIOLATIONS DETECTED:"
            jq -r '.[] | select(.messages | any(.ruleId | startswith("design-system/"))) | .filePath + ":" + (.messages | map(.line | tostring) | join(", "))' eslint-results.json 2>/dev/null || echo "Unable to parse violations"
            echo ""
            echo "📖 Reference: MD3_GOLD_MANIFESTO.md"
            exit 1
          fi

      - name: 🔍 Pattern-Based MD3 Scan
        run: |
          echo "🔍 Scanning for manifesto-forbidden patterns..."

          # Check all source files for forbidden patterns
          VIOLATION_FOUND=false

          # Hardcoded percentages
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "[^a-z-][0-9]\+%[^a-z-]" 2>/dev/null | grep -v "var(--md-sys-percent-" | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: Hardcoded percentages found"
            VIOLATION_FOUND=true
          fi

          # Hardcoded viewport units
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "[0-9]\+\(vh\|vw\|vmin\|vmax\)" 2>/dev/null | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: Hardcoded viewport units found"
            VIOLATION_FOUND=true
          fi

          # Hardcoded motion values
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "\b[0-9]\+\(\.[0-9]\+\)\?\(ms\|s\)\b\|\bease\b\|\bease-in\b\|\bease-out\b\|\bease-in-out\b\|\blinear\b" 2>/dev/null | grep -v "var(--md-sys-motion-" | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: Hardcoded motion values found"
            VIOLATION_FOUND=true
          fi

          # Hardcoded z-index
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "z-index:\s*[0-9]\+" 2>/dev/null | grep -v "var(--md-sys-z-" | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: Hardcoded z-index values found"
            VIOLATION_FOUND=true
          fi

          # Hardcoded grid fr
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "[0-9]\+fr" 2>/dev/null | grep -v "var(--md-sys-grid-fr-" | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: Hardcoded grid fr units found"
            VIOLATION_FOUND=true
          fi

          # margin: auto
          if find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" 2>/dev/null | xargs grep -l "margin:\s*auto" 2>/dev/null | grep -v "var(--md-sys-margin-auto)" | grep -q . 2>/dev/null; then
            echo "❌ FORBIDDEN: margin: auto found"
            VIOLATION_FOUND=true
          fi

          if [ "$VIOLATION_FOUND" = true ]; then
            echo ""
            echo "🚫 MD3 GOLD MANIFESTO VIOLATIONS DETECTED"
            echo "📖 See: MD3_GOLD_MANIFESTO.md for complete forbidden values list"
            exit 1
          fi

      - name: ✅ MD3 Gold Compliance Verified
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ MD3 GOLD COMPLIANCE VERIFIED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔒 All checks passed — codebase maintains MD3 Gold standard"
          echo "📖 Governed by: MD3_GOLD_MANIFESTO.md"