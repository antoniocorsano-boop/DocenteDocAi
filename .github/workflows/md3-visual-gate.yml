name: MD3 Visual Regression Gate

# Visual regression tests are resource-intensive.
# Run manually via workflow_dispatch when needed.
on:
  workflow_dispatch:
  schedule:
    # Run once per week on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md3-visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Setup Playwright browsers
        run: npx playwright install --with-deps

      - name: Run MD3 visual regression tests
        run: npm run test:visual:md3
        continue-on-error: true

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md3-visual-diffs-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
