name: Test Suite & MD3 Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (Unit Tests)
        run: npm run test:ci
        continue-on-error: false

      - name: Run Playwright (E2E & Visual Regression)
        run: npx playwright install --with-deps && npx playwright test e2e/
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            coverage/

  md3-classname-blocker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Block className usage
        run: |
          echo "🔍 Scanning for forbidden className usage..."

          # Find all className occurrences (excluding node_modules and allowed files)
          CLASSNAME_FILES=$(find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" | grep -v node_modules | xargs grep -l "className=" 2>/dev/null || true)

          if [ -n "$CLASSNAME_FILES" ]; then
            echo "❌ CRITICAL: Found className usage in the following files:"
            echo "$CLASSNAME_FILES"
            echo ""
            echo "🚫 className is FORBIDDEN in this project."
            echo "Use MD3 inline styles with tokens: style={{ backgroundColor: 'var(--md-sys-color-surface)' }}"
            exit 1
          fi

          # Check for Tailwind/utility class libraries
          TAILWIND_FILES=$(find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" | grep -v node_modules | xargs grep -l "clsx\|classnames\|tw\|tailwind" 2>/dev/null || true)

          if [ -n "$TAILWIND_FILES" ]; then
            echo "❌ CRITICAL: Found Tailwind/utility class libraries in the following files:"
            echo "$TAILWIND_FILES"
            echo ""
            echo "🚫 Utility CSS libraries are FORBIDDEN in this project."
            echo "Use MD3 design tokens exclusively."
            exit 1
          fi

          echo "✅ No forbidden className or utility CSS usage found."

      - name: Block hardcoded values
        run: |
          echo "🔍 Scanning for hardcoded CSS values..."

          # Find hardcoded px, rem, em values (excluding allowed patterns)
          HARDCODED_FILES=$(find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" | grep -v node_modules | xargs grep -l "[0-9]\+\(px\|rem\|em\|vh\|vw\|vmin\|vmax\)" 2>/dev/null | grep -v "var(--" || true)

          if [ -n "$HARDCODED_FILES" ]; then
            echo "❌ CRITICAL: Found hardcoded CSS values in the following files:"
            echo "$HARDCODED_FILES"
            echo ""
            echo "🚫 Hardcoded CSS values are FORBIDDEN in this project."
            echo "Use MD3 spacing tokens: var(--md-sys-spacing-*)"
            exit 1
          fi

          # Find hardcoded hex colors
          HEX_COLOR_FILES=$(find src/ -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" | grep -v node_modules | xargs grep -l "#[0-9a-fA-F]\{3,8\}" 2>/dev/null | grep -v "var(--" || true)

          if [ -n "$HEX_COLOR_FILES" ]; then
            echo "❌ CRITICAL: Found hardcoded hex colors in the following files:"
            echo "$HEX_COLOR_FILES"
            echo ""
            echo "🚫 Hardcoded colors are FORBIDDEN in this project."
            echo "Use MD3 color tokens: var(--md-sys-color-*)"
            exit 1
          fi

          echo "✅ No hardcoded CSS values or colors found."