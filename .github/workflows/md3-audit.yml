name: MD3 Compliance Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/components/**/*.tsx'
      - 'src/components/**/*.ts'
      - 'src/components/**/*.jsx'
      - 'src/components/**/*.js'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/components/**/*.tsx'
      - 'src/components/**/*.ts'
      - 'src/components/**/*.jsx'
      - 'src/components/**/*.js'

jobs:
  md3-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run MD3 Compliance Audit
      continue-on-error: true
      run: node md3-audit.js check ./src/components 70

    - name: Generate MD3 Report
      run: node md3-audit.js audit ./src/components

    - name: Upload MD3 Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: md3-compliance-report
        path: audit/md3-compliance-report.md

    - name: Comment PR with MD3 Report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const reportPath = path.join(process.cwd(), 'audit', 'md3-compliance-report.md');

          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');

            // Extract summary from report
            const summaryMatch = report.match(/## Riepilogo\n\n([\s\S]*?)\n\n## Issues/);
            const summary = summaryMatch ? summaryMatch[1] : 'Summary not found';

            const issuesMatch = report.match(/## Issues Rilevati\n\n([\s\S]*?)\n\n## Risultati/);
            const issues = issuesMatch ? issuesMatch[1] : 'Issues not found';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 MD3 Compliance Audit Report

### Summary
${summary}

### Issues Detected
${issues}

### 📋 Full Report
The complete MD3 compliance report has been uploaded as an artifact to this workflow run.

**Threshold:** 70% MD3 compliance required
**Status:** ${process.exitCode === 0 ? '✅ Passed' : '❌ Failed'}

### 🎯 What to check:
- Components should use MD3 design tokens (\`--md-sys-*\`)
- Avoid legacy CSS classes (Tailwind, custom classes)
- Use M3Typography for text content
- Ensure proper accessibility and responsive design`
            });
          }